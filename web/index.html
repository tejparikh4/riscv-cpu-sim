<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RISC-V Sim</title>
    <link rel="stylesheet" href="src/style.css">
    <script type="module" src="/src/main.ts"></script>
</head>
<body>
    <main class="workspace">
        <section class="panel">
            <h2>Assembly</h2>
            <div class="assembly-controls">
                <button id="step-button" type="button">Step CPU</button>
                <button id="run-all-button" type="button" disabled>Run All</button>
                <label for="execution-speed">Speed <input id="execution-speed" type="range" min="1" max="10" value="5" disabled>
                </label>
            </div>
            <textarea id="codebox" spellcheck="false">assembly instruction</textarea>
                                    
        </section>
        <section class="tables">
            <section class="panel">
                <h2>Registers</h2>
                <div class="table-scroll">
                    <table id="register-table">
                        <thead>
                            <tr><td>Register numbers</td><td>Values</td></tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                </div>
            </section>

            <section class="panel">
            <h2>Memory</h2>
                <div class="table-scroll">
                    <table id="memory-table">
                        <thead>
                            <tr><td>Memory addresses</td><td>Data</td></tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                </div>
            </section>
        </section>
    </main>
</body>
</html>
